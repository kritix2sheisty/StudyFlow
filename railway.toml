# Railway: API-only container (this file). The website is a second
# service that must set its Dockerfile path to Dockerfile.web so it
# does not reuse this file. After first deploy, attach a volume at
# /data so the SQLite file survives restarts, set TZ to the students'
# timezone, and STUDYFLOW_WEB_KEY to the same value as the website.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/api/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
