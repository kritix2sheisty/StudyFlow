# Shared by every Railway service that deploys this repo.
# Do not pin Dockerfile or /api/health here: the website service would
# inherit them and keep shipping the API.
#
# Per service, in the Railway dashboard:
#   API:  Dockerfile path Dockerfile (or leave unset; auto-detects),
#         health /api/health, volume /data, TZ, STUDYFLOW_WEB_KEY
#   Web:  variable RAILWAY_DOCKERFILE_PATH=Dockerfile.web,
#         health /_health, STUDYFLOW_API_URL, STUDYFLOW_WEB_KEY, TZ

[deploy]
restartPolicyType = "ON_FAILURE"
